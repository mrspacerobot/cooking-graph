# Runs ./check on every pull request and on main. GitHub's own Linux machines, no Mac and no secrets.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check the tools and every file of the graph
        run: ./check
      - name: Build the draft artifact and verify its checksums
        run: |
          ./release
          cd out/release
          shasum -a 256 -c SHA256SUMS
      - name: Production must still be refused until the gates pass
        run: |
          if ./release --channel production; then
            echo "A production release was built from a graph that has not earned it."
            exit 1
          fi
