# Builds the graph artifact and attaches it to a GitHub Release named after its version.
# A merge to main that changes the artifact publishes a draft release by itself. The production channel is only
# ever run by hand from the Actions tab, because it is gated on safety review. The Tomi backend pins a version.
name: Release artifact

on:
  push:
    branches: [main]
    paths: ["graph/**", "tools/**", "release", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      channel:
        description: "draft for internal use, production only when every gate passes"
        type: choice
        options: [draft, production]
        default: draft

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      CHANNEL: ${{ inputs.channel || 'draft' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check the tools and every file of the graph
        run: ./check
      - name: Build the artifact
        run: ./release --channel "$CHANNEL"
      - name: Verify the checksums
        run: cd out/release && shasum -a 256 -c SHA256SUMS
      - name: Publish the release
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('out/release/manifest.json'))['graphVersion'])")
          if gh release view "graph-v$VERSION" >/dev/null 2>&1; then
            echo "graph-v$VERSION is already published; nothing to do."
            exit 0
          fi
          FLAG=""
          if [ "$CHANNEL" = "draft" ]; then FLAG="--prerelease"; fi
          gh release create "graph-v$VERSION" out/release/graph-artifact.json out/release/manifest.json out/release/serving-vectors.json out/release/SHA256SUMS \
            $FLAG --target "$GITHUB_SHA" --title "Graph $VERSION ($CHANNEL channel)" \
            --notes "Channel: $CHANNEL. See manifest.json for the gates and counts. A draft artifact is for internal development and is never shown to a cook."
